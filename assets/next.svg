<svg xmlns="http://www.w3.org/2000/svg" width="880" height="130" viewBox="0 0 880 130">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Consolas, "Liberation Mono", monospace; }
    .fill { animation: load 6s cubic-bezier(.6,0,.2,1) infinite; }
    @keyframes load { 0% { width: 0; } 70% { width: 560px; } 85% { width: 600px; } 100% { width: 600px; } }
    .pct::after { content: ""; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: .25; } }
    @media (prefers-reduced-motion: reduce) { .fill { animation: none; width: 560px; } .blink { animation: none; } }
  </style>
  <rect width="880" height="130" rx="14" fill="#111214"/>
  <rect x="0.5" y="0.5" width="879" height="129" rx="14" fill="none" stroke="#24262B" stroke-dasharray="6 6"/>

  <g class="mono">
    <text x="32" y="46" font-size="13" fill="#646973" font-style="italic">// TODO: próximo projeto</text>
    <text x="32" y="80" font-size="20" font-weight="700" fill="#D8D4CC">compilando a próxima ideia<tspan class="blink" fill="#FF8A5B">_</tspan></text>
    <text x="848" y="80" font-size="13" fill="#E8C872" text-anchor="end">em breve</text>
  </g>

  <rect x="32" y="98" width="816" height="6" rx="3" fill="#1C1E22"/>
  <rect class="fill" x="32" y="98" width="0" height="6" rx="3" fill="#FF8A5B"/>
</svg>
