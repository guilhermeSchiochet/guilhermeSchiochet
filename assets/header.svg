<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Consolas, "Liberation Mono", monospace; font-size: 16px; }
    .gut  { fill: #3F434B; text-anchor: end; }
    .txt  { fill: #D8D4CC; }
    .kw   { fill: #FF8A5B; }
    .cls  { fill: #7FD1C7; }
    .str  { fill: #E8C872; }
    .com  { fill: #646973; font-style: italic; }
    .pun  { fill: #8E949E; }
    .fn   { fill: #A9B8FF; }
    .tab  { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; fill: #D8D4CC; }
    .line { opacity: 0; animation: in .4s ease-out forwards; }
    @keyframes in { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
    .cursor { opacity: 0; animation: blink 1.1s steps(1) 3.2s infinite; }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .line, .cursor { animation: none; opacity: 1; } }
  </style>

  <rect width="880" height="470" rx="14" fill="#111214"/>
  <rect width="880" height="44" rx="14" fill="#18191C"/>
  <rect y="30" width="880" height="14" fill="#18191C"/>
  <circle cx="26" cy="22" r="6" fill="#FF8A5B"/>
  <circle cx="46" cy="22" r="6" fill="#E8C872"/>
  <circle cx="66" cy="22" r="6" fill="#7FD1C7"/>
  <rect x="96" y="10" width="210" height="34" rx="6" fill="#111214"/>
  <text x="114" y="32" class="tab">guilherme_schiochet.dart</text>

  <!-- guias de indentação -->
  <line x1="74" y1="138" x2="74" y2="420" stroke="#1F2125"/>
  <line x1="100" y1="318" x2="100" y2="390" stroke="#1F2125"/>

  <g class="mono">
    <g class="line" style="animation-delay:.2s"><text x="44" y="90" class="gut">1</text><text x="70" y="90" class="com">// construindo coisas que vão pro ar</text></g>
    <g class="line" style="animation-delay:.35s"><text x="44" y="120" class="gut">2</text></g>
    <g class="line" style="animation-delay:.5s"><text x="44" y="150" class="gut">3</text>
      <text x="70" y="150"><tspan class="kw">class</tspan> <tspan class="cls">Guilherme</tspan> <tspan class="kw">extends</tspan> <tspan class="cls">FlutterDev</tspan> <tspan class="pun">{</tspan></text></g>
    <g class="line" style="animation-delay:.7s"><text x="44" y="180" class="gut">4</text>
      <text x="96" y="180"><tspan class="kw">final</tspan> <tspan class="txt">base</tspan></text>
      <text x="236" y="180"><tspan class="pun">=</tspan> <tspan class="str">'Flutter &amp; Dart'</tspan><tspan class="pun">;</tspan></text></g>
    <g class="line" style="animation-delay:.9s"><text x="44" y="210" class="gut">5</text>
      <text x="96" y="210"><tspan class="kw">final</tspan> <tspan class="txt">infra</tspan></text>
      <text x="236" y="210"><tspan class="pun">=</tspan> <tspan class="str">'VPS, deploy e domínio'</tspan><tspan class="pun">;</tspan></text></g>
    <g class="line" style="animation-delay:1.1s"><text x="44" y="240" class="gut">6</text>
      <text x="96" y="240"><tspan class="kw">final</tspan> <tspan class="txt">acelera</tspan></text>
      <text x="236" y="240"><tspan class="pun">=</tspan> <tspan class="str">'IA, como ferramenta'</tspan><tspan class="pun">;</tspan></text></g>
    <g class="line" style="animation-delay:1.25s"><text x="44" y="270" class="gut">7</text></g>
    <g class="line" style="animation-delay:1.4s"><text x="44" y="300" class="gut">8</text>
      <text x="96" y="300"><tspan class="cls">Future</tspan><tspan class="pun">&lt;</tspan><tspan class="kw">void</tspan><tspan class="pun">&gt;</tspan> <tspan class="fn">tirarDoPapel</tspan><tspan class="pun">(</tspan><tspan class="cls">Ideia</tspan> <tspan class="txt">ideia</tspan><tspan class="pun">)</tspan> <tspan class="kw">async</tspan> <tspan class="pun">{</tspan></text></g>
    <g class="line" style="animation-delay:1.6s"><text x="44" y="330" class="gut">9</text>
      <text x="122" y="330"><tspan class="kw">await</tspan> <tspan class="txt">ideia</tspan><tspan class="pun">.</tspan><tspan class="fn">construir</tspan><tspan class="pun">();</tspan></text></g>
    <g class="line" style="animation-delay:1.8s"><text x="44" y="360" class="gut">10</text>
      <text x="122" y="360"><tspan class="kw">await</tspan> <tspan class="txt">ideia</tspan><tspan class="pun">.</tspan><tspan class="fn">colocarNoAr</tspan><tspan class="pun">();</tspan></text>
      <text x="372" y="360" class="com">// sem ficar na gaveta</text></g>
    <g class="line" style="animation-delay:2s"><text x="44" y="390" class="gut">11</text><text x="96" y="390" class="pun">}</text></g>
    <g class="line" style="animation-delay:2.2s"><text x="44" y="420" class="gut">12</text><text x="70" y="420" class="pun">}</text></g>
  </g>
  <rect class="cursor" x="84" y="405" width="9" height="19" fill="#FF8A5B"/>
</svg>
