<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Consolas, "Liberation Mono", monospace; font-size: 15px; }
    .ps   { fill: #7FD1C7; }
    .cmd  { fill: #D8D4CC; }
    .ok   { fill: #7FD1C7; }
    .out  { fill: #8E949E; }
    .hi   { fill: #E8C872; }
    .tab  { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; fill: #8E949E; }
    .type { width: 0; animation: type .7s steps(28) forwards; }
    @keyframes type { to { width: 820px; } }
    .show { opacity: 0; animation: show .01s forwards; }
    @keyframes show { to { opacity: 1; } }
    .cursor { opacity: 0; animation: blink 1.1s steps(1) 5.6s infinite; }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .type { animation: none; width: 820px; }
      .show, .cursor { animation: none; opacity: 1; }
    }
  </style>

  <defs>
    <clipPath id="c1"><rect class="type" x="30" y="70" height="26" style="animation-delay:.3s"/></clipPath>
    <clipPath id="c2"><rect class="type" x="30" y="130" height="26" style="animation-delay:1.5s"/></clipPath>
    <clipPath id="c3"><rect class="type" x="30" y="190" height="26" style="animation-delay:2.7s"/></clipPath>
    <clipPath id="c4"><rect class="type" x="30" y="250" height="26" style="animation-delay:3.9s"/></clipPath>
  </defs>

  <rect width="880" height="340" rx="14" fill="#0B0C0E"/>
  <rect x="0.5" y="0.5" width="879" height="339" rx="14" fill="none" stroke="#24262B"/>
  <circle cx="26" cy="22" r="6" fill="#2A2D33"/>
  <circle cx="46" cy="22" r="6" fill="#2A2D33"/>
  <circle cx="66" cy="22" r="6" fill="#2A2D33"/>
  <text x="440" y="27" class="tab" text-anchor="middle">guilherme@vps: ~</text>

  <g class="mono">
    <text x="30" y="88" clip-path="url(#c1)"><tspan class="ps">~/dmflow-api $</tspan> <tspan class="cmd">git pull &amp;&amp; npm run build</tspan></text>
    <text x="30" y="114" class="ok show" style="animation-delay:1.1s">✓ <tspan class="out">build concluído</tspan></text>

    <text x="30" y="148" clip-path="url(#c2)"><tspan class="ps">~/dmflow-api $</tspan> <tspan class="cmd">pm2 reload dmflow-api</tspan></text>
    <text x="30" y="174" class="ok show" style="animation-delay:2.3s">✓ <tspan class="out">[dmflow-api]</tspan> <tspan class="hi">online</tspan></text>

    <text x="30" y="208" clip-path="url(#c3)"><tspan class="ps">~ $</tspan> <tspan class="cmd">sudo nginx -t &amp;&amp; sudo systemctl reload nginx</tspan></text>
    <text x="30" y="234" class="ok show" style="animation-delay:3.5s">✓ <tspan class="out">nginx: syntax is ok</tspan></text>

    <text x="30" y="268" clip-path="url(#c4)"><tspan class="ps">~ $</tspan> <tspan class="cmd">curl -sI https://dmflow.mocley.com | head -1</tspan></text>
    <text x="30" y="294" class="show" style="animation-delay:4.7s"><tspan class="hi">HTTP/2 200</tspan>  <tspan class="out">no ar.</tspan></text>

    <text x="30" y="324" class="ps show" style="animation-delay:5.2s">~ $</text>
  </g>
  <rect class="cursor" x="68" y="310" width="9" height="18" fill="#FF8A5B"/>
</svg>
